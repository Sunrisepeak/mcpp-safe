# MC++: the mcxx driver (the root package, src/), libmc++ (modules/) and MC++'s plugins (plugins/).
# README.md has the map; every directory under modules/ and plugins/ has its own README.md.
#
#   modules/base, os, arch, testing   foundations (no dependency beyond openkal-llvm-runtime)
#   modules/msa                       the MC++ semantic API and its facts (MC3)
#   modules/graph                     module declarations scanned lexically, the module graph
#   modules/plugin/sdk                the plugin SDK (MC4): providers, rules, source filters, profiles, the catalog
#   modules/features                  the feature gates (MC1) and MC++'s built-in provider mc++.iso
#   modules/lsp                       an LSP-shaped semantic service over MSA (MC6)
#   modules/backend/semantic          mcxx.backend: the semantic facade (what mcppls links)
#   modules/backend/compiler          mcxx.backend.compiler: the compiling facade (what mcxx links)
#   modules/backend/clang             MSA over Clang 23.1, facts, and MC++'s plugins inside Clang
#   modules/backend/clang-compiler    clang itself in process: driver, cc1, code generation
#   plugins/std, plugins/libs         plugin implementations: mc++.policy, [[mcpp::cfg]]; nlohmann::json
#   tools/probe, tools/checks         a development driver for the service; source rules
#
# Only modules/backend/clang and modules/backend/clang-compiler name Clang or depend on llvm.*
# (tools/checks/lint.py, rule clang-exposure): everything else sees MSA, facts and the facades.
[workspace]
members = [
    "modules/arch/x86_64",
    "modules/arch/aarch64",
    "modules/os/linux",
    "modules/os/macos",
    "modules/os/windows",
    "modules/testing",
    "modules/base",
    "modules/msa",
    "modules/graph",
    "modules/plugin/sdk",
    "modules/features",
    "modules/lsp",
    "modules/backend/semantic",
    "modules/backend/compiler",
    "modules/backend/clang",
    "modules/backend/clang-compiler",
    "plugins/std",
    "plugins/libs",
    "tools/probe",
    "tools/conformance",
]

# This repository's own package index (rule R2): llvm.clang-dev for mcxx.clang.
[indices]
llvm = { path = "index/llvm" }

[workspace.dependencies]
openkal-llvm-runtime = "0.15.2"

[workspace.dependencies.nlohmann]
json = "3.12.0"

[package]
name        = "mcxx"
version     = "0.1.0"
description = "The MC++ compiler driver: clang 23.1 in process, with MC++'s feature gates and module services"
license     = "Apache-2.0"
authors     = ["speak-agent"]

[targets.mcxx]
kind = "bin"
main = "src/main.cpp"

[build]
sources = ["src/**/*.cppm", "src/**/*.cpp"]
ldflags = ["-Wl,--error-limit=0"]

[dependencies]
openkal-llvm-runtime = "0.15.2"
mcxx-base              = { path = "modules/base" }
mcxx-msa               = { path = "modules/msa" }
mcxx-backend           = { path = "modules/backend/semantic" }
mcxx-backend-compiler  = { path = "modules/backend/compiler" }
mcxx-plugin            = { path = "modules/plugin/sdk" }   # `mcxx features`: the catalog
mcxx-features          = { path = "modules/features" }     # the built-in provider mc++.iso, the gates
# The plugins, statically composed into this program (V0.5: no dlopen); `mcxx compose` makes a
# project's own set later (A0.6.1).
mcxx-plugins-std  = { path = "plugins/std" }
mcxx-plugins-libs = { path = "plugins/libs" }

# Version settlement only, not a dependency of the driver's own code: llvm.codegen-dev reaches
# llvm.clang-dev by path inside its archive and mcxx.backend.clang by version, and mcpp asks the
# root to say which one the graph holds. (The one llvm.* name outside modules/backend; the
# clang-exposure rule allows exactly this table here.)
[dependencies.llvm]
clang-dev = "23.1.0.2"
