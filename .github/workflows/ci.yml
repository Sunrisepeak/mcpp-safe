name: CI

# libmc++: source rules, unit tests (the backend's against a small modules program), and the probe.
# The forks (speak-agent/llvm-clang-dev, speak-agent/mcpp-language-server) have CI of their own.
#
# Local first: every step here is what `tools/checks/lint.py` and `mcpp test -p <member>` do on a
# developer's machine; this is the second opinion, on a clean runner.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XLINGS_NON_INTERACTIVE: '1'
  XLINGS_VERSION: v2026.8.17.2
  MCPP_VERSION: 2026.9.28.2
  LLVM_VERSION: 22.1.8

jobs:
  lint:
    name: source rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/checks/lint.py
      - name: Specifications (schemas, examples, traceability)
        run: |
          sudo apt-get install -y python3-jsonschema
          python3 tools/checks/specs.py

  test:
    name: unit tests and the probe (linux-x64)
    runs-on: ubuntu-24.04
    # A cold run (a new llvm.clang-dev: Clang's objects built again) takes about three hours.
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: xlings
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      # The package store and mcpp's own build cache: Clang's objects (llvm.clang-dev) are built once
      # for a version and flags, then reused by every run. Saved once the unit tests have built them,
      # not at the job's end: a run cancelled or out of time after that still leaves them to the next.
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.mcpp/registry/data/xpkgs
            ~/.mcpp/build-cache
          key: mcxx-${{ runner.os }}-${{ env.MCPP_VERSION }}-${{ hashFiles('index/**', '**/mcpp.toml') }}
          restore-keys: mcxx-${{ runner.os }}-${{ env.MCPP_VERSION }}-
      - name: mcpp and LLVM
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do xlings install "mcpp@$MCPP_VERSION" -y -g && break; sleep 20; done
          mcpp --version
          mcpp self config --mirror GLOBAL
          mcpp toolchain install llvm "$LLVM_VERSION"
          mcpp toolchain default "llvm@$LLVM_VERSION"
      - name: Unit tests
        run: |
          set -euo pipefail
          for member in modules/base modules/graph modules/lsp modules/features modules/diagnostics modules/frontend modules/ifc modules/plugin/wire modules/plugin/remote modules/plugin/host modules/serve plugins/std plugins/libs modules/backend/clang; do
            echo "::group::$member"
            mcpp test -p "$member"
            echo "::endgroup::"
          done
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.mcpp/registry/data/xpkgs
            ~/.mcpp/build-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: The mcxx driver and the probe
        run: |
          set -euo pipefail
          mcpp build
          mcpp build -p tools/probe
          mcpp build -p tools/conformance
          mcpp build -p tools/lexdump
          "$(find tools/conformance/target -type f -name mcxx-conformance -path '*/bin/*' | head -1)" --json gates.json --driver "$(realpath "$(find target -type f -name mcxx -path '*/bin/*' | head -1)")" --frontend conformance/gates
          lexdump=$(find tools/lexdump/target -type f -name mcxx-lexdump -path '*/bin/*' | head -1)
          python3 tools/checks/symbols.py "$(find modules/features/target -type f -name test_iso -path '*/bin/*' | head -1)" "$lexdump" --expect-clang "$(find target -type f -name mcxx -path '*/bin/*' | head -1)"
          # MC++'s lexer against Clang's (A1.6.1): the edge cases, this repository, Clang's own lexer and headers, libc++.
          clang_dev=$(ls -d "$PWD"/.mcpp/.xlings/data/xpkgs/llvm-x-clang-dev/23.1.0.6/*/llvm | head -1)
          python3 tools/checks/lexdiff.py --lexdump "$lexdump" --probe "$(find tools/probe/target -type f -name mcxx-probe -path '*/bin/*' | head -1)" \
            modules/frontend/corpus/lex src modules plugins tools "$clang_dev/clang/lib/Lex" "$clang_dev/clang/include" \
            "$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/$LLVM_VERSION/include/c++/v1" --any
          mcxx=$(find target -type f -name mcxx -path '*/bin/*' | head -1)
          "$mcxx" version
          "$mcxx" features
          python3 -c "import jsonschema" 2>/dev/null || sudo apt-get install -y python3-jsonschema
          python3 tools/checks/specs.py --mcxx "$mcxx"
      - name: mcxx as mcpp's toolchain (V0.6), and C-mcppls built with it passes its tests (A0.5.3)
        run: |
          set -euo pipefail
          export XLINGS_HOME="$HOME/.mcpp/registry"
          mcxx=$(realpath "$(find target -type f -name mcxx -path '*/bin/*' | head -1)")
          headers=$(ls -d "$PWD"/.mcpp/.xlings/data/xpkgs/llvm-x-clang-dev/23.1.0.6/*/llvm/clang/lib/Headers | head -1)
          # E-XL-1: installed from this repository's xpkg, selected with `xlings use`, run through xlings' path.
          python3 tools/checks/xlings.py --mcxx "$mcxx" --headers "$headers"
          python3 tools/checks/toolchain.py --work "$HOME/toolchain-check"
          python3 tools/checks/selfhost.py --work "$HOME/c-mcppls"
          # MC2 (M1.1): every C-mcppls interface unit's .ifc beside its BMI, read by the IFC SDK's ifc-printer
          # and read back equal to a parse's declarations; the dialect fixture's (A1.1.1 - A1.1.4).
          python3 tools/checks/ifc.py --mcxx "$(realpath "$(find target -type f -name mcxx -path '*/bin/*' | head -1)")" \
            --probe "$(realpath "$(find tools/probe/target -type f -name mcxx-probe -path '*/bin/*' | head -1)")" \
            --corpus "$HOME/c-mcppls" --resource "$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/23.1.0-mcxx/lib/clang/23" --jobs 2 --work "$HOME/ifc-check"
          # The dialect boundary (M1.2): a safe module's imports, annotated or not, the imported sources deleted,
          # the store; and the manifest's form built by mcpp with mcxx (A1.2.1, A1.2.2).
          python3 tools/checks/boundary.py --mcxx "$(realpath "$(find target -type f -name mcxx -path '*/bin/*' | head -1)")" \
            --toolchain llvm@23.1.0-mcxx --work "$HOME/boundary-check"
          probe=$(realpath "$(find tools/probe/target -type f -name mcxx-probe -path '*/bin/*' | head -1)")
          python3 tools/checks/facts.py --corpus "$HOME/c-mcppls" --probe "$probe" --resource "$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/23.1.0-mcxx/lib/clang/23" --jobs 2 \
            --reference-cache "$HOME/syntax-reference"
          # MC++'s parser against Clang's outline (A1.7.1, A1.7.2), from the outlines facts.py kept.
          lexdump=$(realpath "$(find tools/lexdump/target -type f -name mcxx-lexdump -path '*/bin/*' | head -1)")
          # M2.2: an import answered from the module's interface alone, its source and BMI gone (A2.2.1); a
          # member of a deduced return type said uncertain, and answered by the Clang backend (A2.2.3).
          python3 tools/checks/imports.py --mcxx "$(realpath "$(find target -type f -name mcxx -path '*/bin/*' | head -1)")" --lexdump "$lexdump" \
            --probe "$probe" --resource "$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/23.1.0-mcxx/lib/clang/23" --work "$HOME/imports-check"
          python3 tools/checks/syntaxdiff.py --corpus "$HOME/c-mcppls" --probe "$probe" --lexdump "$lexdump" --reference-cache "$HOME/syntax-reference" \
            --resource "$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/23.1.0-mcxx/lib/clang/23" --jobs 4
          # MC++'s declarations and name lookup against Clang's (M2.1), as regression gates at what is reached.
          python3 tools/checks/declsdiff.py --corpus "$HOME/c-mcppls" --probe "$probe" --lexdump "$lexdump" --reference-cache "$HOME/decls-reference" \
            --resource "$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/23.1.0-mcxx/lib/clang/23" --jobs 4 --min matched=99.9 --min qualified-name=99.9 \
            --min container=99.9 --min exported=99.9 --min local=99.9 --min type=80 --min templates=95 \
            --min-written type=99.9 --min-written templates=99.5 --min-written pointer=99.5 \
            --max-differ type=0.1 --max-differ templates=0.1 --max-differ pointer=0.1
          python3 tools/checks/refsdiff.py --corpus "$HOME/c-mcppls" --probe "$probe" --lexdump "$lexdump" --reference-cache "$HOME/refs-reference" \
            --resource "$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/23.1.0-mcxx/lib/clang/23" --jobs 4 --min-in-file 99.8 --min-overall 99 --max-other 0.1
          # Every C-mcppls source cut short or given random tokens 1000 times, parsed each time (A1.7.3); the
          # whole corpus parsed cold within 2 s (A1.7.4).
          mcpp build --release -p tools/lexdump
          fast=$(realpath "$(ls -t $(find tools/lexdump/target -type f -name mcxx-lexdump -path '*/bin/*') | head -1)")
          sources=$(python3 -c "import json,glob,os; p=sorted(glob.glob(os.path.expanduser('~/c-mcppls/target/*/*/compile_commands.json')),key=os.path.getmtime)[-1]; c=os.path.expanduser('~/c-mcppls/'); print(' '.join(sorted({u['file'] for u in json.load(open(p)) if u['file'].startswith(c) and '/target/' not in u['file']})))")
          echo $sources | xargs -n 16 -P 4 "$fast" --fuzz 1000
          "$fast" --parse-bench 3 $sources | python3 -c "import json,sys; r=json.load(sys.stdin); print(r); sys.exit(0 if r['seconds'] <= 2.0 else 1)"
          # MC++'s preprocessor against Clang's -E (A1.6.2), the headers' macros from Clang as a host would give them.
          python3 tools/checks/ppdiff.py --lexdump "$(realpath "$(find tools/lexdump/target -type f -name mcxx-lexdump -path '*/bin/*' | head -1)")" \
            --clang "$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/23.1.0-mcxx/bin/clang++" --root "$HOME/c-mcppls" --header-macros \
            --db "$(ls -t "$HOME"/c-mcppls/target/*/*/compile_commands.json | head -1)"
      - name: mcxx compose, end to end; the same plugin built with GCC 16 out of process
        run: |
          set -euo pipefail
          mcpp toolchain install gcc 16.1.0
          (cd plugins/examples/naming-remote && mcpp build --toolchain gcc@16.1.0)
          remote=$(find plugins/examples/naming-remote/target -type f -name mcxx-example-naming-remote -path '*/bin/*' | head -1)
          # The same plugin as a plugin library, loaded into plain mcxx (MC4 §3, `library`).
          (cd plugins/examples/naming-library && mcpp build)
          library=$(find plugins/examples/naming-library/target -type f -name 'libmcxx-example-naming-library.so' | head -1)
          mcxx=$(find target -type f -name mcxx -path '*/bin/*' | head -1)
          python3 tools/checks/compose.py --mcxx "$(realpath "$mcxx")" --remote "$(realpath "$remote")" --library "$(realpath "$library")" --work "$HOME/compose-check"
          # mcpp-tools-safe (A1.5): a program built with GCC, gated by MC++ as a blocking check action.
          python3 tools/checks/tools_safe.py --mcxx "$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/23.1.0-mcxx/bin/mcxx" --work "$HOME/tools-safe-check"
          # A1.5.2 on C-mcpp (mcpp-community/mcpp at the corpus revision), built with GCC under the check:
          # the goto it has is found; with asm denied it builds, an asm added fails it, removed it builds.
          git clone --quiet https://github.com/mcpp-community/mcpp.git "$HOME/c-mcpp" && git -C "$HOME/c-mcpp" checkout --quiet 982fc730
          python3 tools/checks/tools_safe.py --mcxx "$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/23.1.0-mcxx/bin/mcxx" --work "$HOME/tools-safe-corpus" --corpus "$HOME/c-mcpp"
          # E-IDX-5: the rule package and the plugins from this repository's index (the 0.1.0 archive).
          python3 tools/checks/index.py --mcxx "$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/23.1.0-mcxx/bin/mcxx" --work "$HOME/index-check"
          printf 'extern "C" int puts(const char*);\n[[mcpp::cfg(unix)]] int main() { puts("unix"); }\n[[mcpp::cfg(windows)]] int main() { Win(); }\n' > cfg.cpp
          "$mcxx" check --target=x86_64-unknown-linux-gnu cfg.cpp

  # libmc++'s unit tests on openkal's other targets (M1's exit: the engine on mcppls' three platforms):
  # cross-built here, the Windows ones run under wine, the macOS ones on a macOS runner.
  platforms:
    name: unit tests for Windows (wine) and macOS, cross-built
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: xlings
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp/registry/data/xpkgs
            ~/.mcpp/build-cache
          key: mcxx-platforms-${{ runner.os }}-${{ env.MCPP_VERSION }}-${{ hashFiles('index/**', '**/mcpp.toml') }}
          restore-keys: mcxx-platforms-${{ runner.os }}-${{ env.MCPP_VERSION }}-
      - name: mcpp, LLVM and wine
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do xlings install "mcpp@$MCPP_VERSION" -y -g && break; sleep 20; done
          mcpp self config --mirror GLOBAL
          mcpp toolchain install llvm "$LLVM_VERSION"
          mcpp toolchain default "llvm@$LLVM_VERSION"
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y wine64 > /dev/null || sudo apt-get install -y wine > /dev/null
      - name: Windows (x86_64-windows-gnu), under wine
        run: python3 tools/checks/platforms.py --target x86_64-windows-gnu --wine
      - name: macOS (aarch64-macos), built
        run: python3 tools/checks/platforms.py --target aarch64-macos --out cross
      - uses: actions/upload-artifact@v4
        with:
          name: unit-tests-aarch64-macos
          path: cross
          retention-days: 7

  platforms-macos:
    name: unit tests on macos-14 (aarch64-macos)
    needs: platforms
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unit-tests-aarch64-macos
          path: cross
      - run: python3 tools/checks/platforms.py --run cross/aarch64-macos

  # E-XIM-3: the mcxx xpkg (xpkgs/pkgs/m/mcxx.lua) on the other two platforms. mcxx is cross-built
  # here for each, with Clang's builtin headers (the generated intrinsics ones among them), and handed
  # to a job on the platform itself, which installs it through xlings over mcpp's llvm 22.1.8 and
  # builds and runs a modules program with mcpp's --toolchain llvm@23.1.0-mcxx.
  mcxx-cross:
    name: mcxx cross-built (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-windows-gnu, aarch64-macos]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: xlings
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.mcpp/registry/data/xpkgs
            ~/.mcpp/build-cache
          key: mcxx-cross-${{ matrix.target }}-${{ env.MCPP_VERSION }}-${{ hashFiles('index/**', '**/mcpp.toml') }}
          restore-keys: mcxx-cross-${{ matrix.target }}-${{ env.MCPP_VERSION }}-
      - name: mcpp and LLVM
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do xlings install "mcpp@$MCPP_VERSION" -y -g && break; sleep 20; done
          mcpp self config --mirror GLOBAL
          mcpp toolchain install llvm "$LLVM_VERSION"
          mcpp toolchain default "llvm@$LLVM_VERSION"
      - name: mcxx for ${{ matrix.target }}
        run: |
          set -euo pipefail
          target=${{ matrix.target }}
          mcpp build --target "$target"
          exe=mcxx; case "$target" in *windows*) exe=mcxx.exe ;; esac
          out="$PWD/xpkg-$target"; mkdir -p "$out/headers"
          cp "$(ls -t $(find "target/$target" -type f -name "$exe" -path '*/bin/*') | head -1)" "$out/$exe"
          headers=$(ls -d "$PWD"/.mcpp/.xlings/data/xpkgs/llvm-x-clang-dev/23.1.0.6/*/llvm/clang/lib/Headers | head -1)
          cp -R "$headers"/. "$out/headers/"
          cp "$headers"/../../../../llvm-generated/clang-lib/Headers/* "$out/headers/"
          ls -la "$out" && ls "$out/headers" | wc -l
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.mcpp/registry/data/xpkgs
            ~/.mcpp/build-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: mcxx-${{ matrix.target }}
          path: xpkg-${{ matrix.target }}
          retention-days: 7

  xpkg:
    name: the mcxx xpkg on ${{ matrix.os }} (E-XIM-3)
    needs: mcxx-cross
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-windows-gnu
            exe: mcxx.exe
          - os: macos-14
            target: aarch64-macos
            exe: mcxx
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: xlings (macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - name: xlings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://d2learn.org/xlings-install.ps1.txt | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: mcpp and LLVM
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do xlings install "mcpp@$MCPP_VERSION" -y -g && break; sleep 20; done
          mcpp --version
          mcpp self config --mirror GLOBAL
          for attempt in 1 2 3; do mcpp toolchain install llvm "$LLVM_VERSION" && break; sleep 20; done
          mcpp toolchain default "llvm@$LLVM_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: mcxx-${{ matrix.target }}
          path: mcxx
      - name: Installed through xlings, and mcpp builds with it
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          chmod +x "mcxx/${{ matrix.exe }}"
          "$py" tools/checks/xlings.py --mcxx "mcxx/${{ matrix.exe }}" --headers mcxx/headers
          "$py" tools/checks/toolchain.py --work "$HOME/toolchain-check"
