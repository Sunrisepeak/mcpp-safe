# mcxx-lexdump: MC++'s own lexer over files, one token per line as JSON (tools/checks/lexdiff.py).
[package]
name        = "mcxx-lexdump"
version     = "0.1.0"
description = "Prints the tokens of MC++'s own lexer (mcxx.frontend.lex), for comparison with Clang's"
license     = "Apache-2.0"

[targets.mcxx-lexdump]
kind = "bin"
main = "src/main.cpp"

[dependencies]
openkal-llvm-runtime.workspace = true
mcxx-msa      = { path = "../../modules/msa" }
mcxx-frontend = { path = "../../modules/frontend" }
mcxx-base     = { path = "../../modules/base" }       # MCXX_LOG, MCXX_TRACE
mcxx-ifc      = { path = "../../modules/ifc" }        # --references: the imports' MC2 interfaces (M2.2)
