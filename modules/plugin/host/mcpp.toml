# The host side of MC++'s plugins: out-of-process plugins (MC4 §6) started, spoken to and isolated
# (a crash, a hang or a wrong answer is a reported failure, never a crashed compiler: MC4 §5), and
# registered in the catalog as proxies; and what the compiler knows about its static composition.
[package]
name        = "mcxx-plugin-host"
version     = "0.1.0"
description = "MC++ plugin host: out-of-process plugins over MC4 protocol 1, isolated"
license     = "Apache-2.0"

[targets.mcxx-plugin-host]
kind = "lib"

[dependencies]
openkal-llvm-runtime = "0.15.2"
mcxx-base        = { path = "../../base" }
mcxx-msa         = { path = "../../msa" }
mcxx-plugin      = { path = "../sdk" }
mcxx-plugin-wire = { path = "../wire" }
mcxx-features    = { path = "../../features" }

[dependencies.nlohmann]
json = "3.12.0"

[dev-dependencies]
mcxx-testing       = { path = "../../testing" }
mcxx-plugin-remote = { path = "../remote" }
# Its tests' C library, as the root names it: `mcpp test -p` makes this package the root of a graph the
# root's declaration does not settle (upstream's 0.19.2 cannot start for a constructor on macOS). A
# test-only edge: a package depending on this one is not handed a git declaration to clash with.
openkal-musl = { git = "https://github.com/speak-agent/openkal-musl.git", tag = "0.19.7" }

[lib]
path = "src/host.cppm"
