# The plugin side of MC4's out-of-process protocol: a program that links plugin packages and calls
# mcxx::plugin::remote::serve() serves their providers -- the same registrations a static
# composition uses -- to a host over standard input and output (specs/mc4-plugins.md §6).
[package]
name        = "mcxx-plugin-remote"
version     = "0.1.0"
description = "MC++ plugins out of process: serves the providers linked into a program over MC4 protocol 1"
license     = "Apache-2.0"

[targets.mcxx-plugin-remote]
kind = "lib"

[dependencies]
mcxx-msa         = { path = "../../msa" }
mcxx-plugin      = { path = "../sdk" }
mcxx-plugin-wire = { path = "../wire" }

[dependencies.nlohmann]
json = "3.12.0"

[dev-dependencies]
mcxx-testing = { path = "../../testing" }
openkal-llvm-runtime = "0.15.2"   # the tests run as mcxx does; the library names no runtime
# Its tests' C library, as the root names it: `mcpp test -p` makes this package the root of a graph the
# root's declaration does not settle (upstream's 0.19.2 cannot start for a constructor on macOS). A
# test-only edge: a package depending on this one is not handed a git declaration to clash with.
openkal-musl = { git = "https://github.com/speak-agent/openkal-musl.git", tag = "0.19.9" }

[lib]
path = "src/remote.cppm"
