# The JSON forms MC++'s plugins speak: MC3 facts (specs/mc3-facts.md §4.11) and the MC4 protocol's
# messages (specs/mc4-plugins.md §6). Both sides use it: the host (mcxx.plugin.host) and a plugin
# process (mcxx.plugin.remote). No backend.
[package]
name        = "mcxx-plugin-wire"
version     = "0.1.0"
description = "MC++ plugin wire formats: MC3 facts and MC4 protocol messages as JSON"
license     = "Apache-2.0"

[targets.mcxx-plugin-wire]
kind = "lib"

[dependencies]
mcxx-msa    = { path = "../../msa" }
mcxx-plugin = { path = "../sdk" }

[dependencies.nlohmann]
json = "3.12.0"

[dev-dependencies]
mcxx-testing = { path = "../../testing" }
openkal-llvm-runtime = "0.15.2"   # the tests run as mcxx does; the library names no runtime
# Its tests' C library, as the root names it: `mcpp test -p` makes this package the root of a graph the
# root's declaration does not settle (upstream's 0.19.2 cannot start for a constructor on macOS). A
# test-only edge: a package depending on this one is not handed a git declaration to clash with.
openkal-musl = { git = "https://github.com/speak-agent/openkal-musl.git", tag = "0.19.7" }

[lib]
path = "src/wire.cppm"
