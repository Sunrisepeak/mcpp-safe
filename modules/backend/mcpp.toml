# The backend a consumer asks for, without naming it: today MSA over Clang (mcxx.clang); MC++'s own
# front end takes its place here later, and no consumer changes. Consumers depend on this package
# (with mcxx-msa and mcxx-lsp), never on a backend package directly (plan P1).
[package]
name        = "mcxx-backend"
version     = "0.1.0"
description = "The MC++ backend facade: a msa::Workspace and what the backend is, whichever backend implements it"
license     = "Apache-2.0"

[targets.mcxx-backend]
kind = "lib"

[dependencies]
openkal-llvm-runtime.workspace = true
mcxx-msa   = { path = "../msa" }
mcxx-clang = { path = "../clang" }

[lib]
path = "src/backend.cppm"
