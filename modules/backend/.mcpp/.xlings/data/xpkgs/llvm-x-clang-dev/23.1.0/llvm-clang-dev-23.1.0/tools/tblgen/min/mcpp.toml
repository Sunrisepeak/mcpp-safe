[package]
name        = "llvm-min-tblgen"
version     = "23.1.0"
description = "llvm-min-tblgen: the TableGen emitters that need no generated input"
license     = "Apache-2.0 WITH LLVM-exception"

[targets.llvm-min-tblgen]
kind = "bin"
main = "../../../llvm/llvm/utils/TableGen/llvm-min-tblgen.cpp"

[dependencies]
openkal-llvm-runtime.workspace = true
tblgen-support = { path = "../support" }

[build]
sources      = ["../../../llvm/llvm/utils/TableGen/Basic/*.cpp"]
include_dirs = ["../../../llvm/llvm/utils/TableGen", "../../../llvm-generated/include", "../../../llvm/llvm/include"]
defines      = ["_GNU_SOURCE", "__STDC_CONSTANT_MACROS", "__STDC_FORMAT_MACROS", "__STDC_LIMIT_MACROS", "NDEBUG"]
cxxflags     = ["-O2", "-g0", "-w"]
