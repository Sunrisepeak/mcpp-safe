# The feature gates (MC1 v0): which level each feature has for a piece of code -- from a package's
# [package.metadata.mcxx], its profiles, and [[mcpp::allow]] on a declaration -- and the diagnostics
# and audit records the rules' findings become; and mc++.iso (mcxx.features.iso), MC++'s built-in
# provider of ISO C++ feature controls. No backend: it reads MSA facts and the catalog.
[package]
name        = "mcxx-features"
version     = "0.1.0"
description = "MC++ feature gates: configuration, scopes, levels, waivers and audit over plugin rules"
license     = "Apache-2.0"

[targets.mcxx-features]
kind = "lib"

[dependencies]
openkal-llvm-runtime = "0.15.2"   # stated, not inherited: consumers outside this workspace read it
mcxx-base   = { path = "../base" }
mcxx-msa    = { path = "../msa" }
mcxx-plugin = { path = "../plugin/sdk" }

[dev-dependencies]
mcxx-testing = { path = "../testing" }
# Its tests' C library, as the root names it: `mcpp test -p` makes this package the root of a graph the
# root's declaration does not settle (upstream's 0.19.2 cannot start for a constructor on macOS). A
# test-only edge: a package depending on this one is not handed a git declaration to clash with.
openkal-musl = { git = "https://github.com/speak-agent/openkal-musl.git", tag = "0.19.7" }

[lib]
path = "src/features.cppm"
