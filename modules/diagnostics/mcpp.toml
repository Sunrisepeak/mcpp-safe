# Diagnostics as people and as agents read them (MC5 §9): the human view (a compiler error laid out as
# Rust's are) and the agent view (one JSON object each). No compiler: a backend hands it diagnostics.
[package]
name        = "mcxx-diagnostics"
version     = "0.1.0"
description = "MC++ diagnostics in two views: human (Rust-like) and agent (JSON Lines)"
license     = "Apache-2.0"

[targets.mcxx-diagnostics]
kind = "lib"

[dependencies]
openkal-llvm-runtime = "0.15.2"   # stated, not inherited: consumers outside this workspace read it
openkal-musl = { git = "https://github.com/speak-agent/openkal-musl.git", tag = "0.19.7" }   # as the root: a `-p` graph of its own (tests) is not settled by it
mcxx-msa = { path = "../msa" }

[dependencies.nlohmann]
json = "3.12.0"

[dev-dependencies]
mcxx-testing = { path = "../testing" }

[lib]
path = "src/diagnostics.cppm"
