[package]
name        = "clang-tblgen"
version     = "23.1.0"
description = "clang-tblgen: Clang's TableGen emitters"
license     = "Apache-2.0 WITH LLVM-exception"

[targets.clang-tblgen]
kind = "bin"
main = "../../../llvm/clang/utils/TableGen/TableGen.cpp"

[dependencies]
openkal-llvm-runtime.workspace = true
tblgen-support = { path = "../support" }

[build]
sources      = ["../../../llvm/clang/utils/TableGen/*.cpp", "../../../llvm/clang/lib/Support/*.cpp"]
include_dirs = ["../../../llvm/clang/utils/TableGen", "../../../llvm-generated/include", "../../../llvm/llvm/include", "../../../llvm/clang/include"]
defines      = ["_GNU_SOURCE", "__STDC_CONSTANT_MACROS", "__STDC_FORMAT_MACROS", "__STDC_LIMIT_MACROS", "NDEBUG"]
cxxflags     = ["-O2", "-g0", "-w"]
