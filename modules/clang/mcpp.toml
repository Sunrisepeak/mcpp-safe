# MSA over Clang 23.1: the only libmc++ package that depends on Clang (plan P1).
#
# llvm.clang-dev is Clang's frontend libraries built by mcpp on openkal (speak-agent/llvm-clang-dev,
# E-IDX-1), served by this repository's own index (index/llvm, rule R2).
[package]
name        = "mcxx-clang"
version     = "0.1.0"
description = "The MC++ semantic API over Clang 23.1: module interfaces, parsing, index, completion"
license     = "Apache-2.0"

[targets.mcxx-clang]
kind = "lib"

[dependencies]
openkal-llvm-runtime = "0.15.2"   # stated, not inherited: consumers outside this workspace read it
mcxx-base  = { path = "../base" }
mcxx-msa   = { path = "../msa" }
mcxx-graph = { path = "../graph" }
mcxx-plugin   = { path = "../plugin" }
mcxx-features = { path = "../features" }

[dependencies.llvm]
clang-dev = "23.1.0.2"

[lib]
path = "src/clang.cppm"

[dev-dependencies]
mcxx-testing    = { path = "../testing" }
mcxx-rules-json = { path = "../../plugins/json" }
mcxx-safe       = { path = "../../plugins/safe" }
mcxx-cfg        = { path = "../../plugins/cfg" }
