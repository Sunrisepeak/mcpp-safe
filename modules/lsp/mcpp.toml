# An LSP-shaped semantic service over MSA (spec MC6), transport-free.
[package]
name        = "mcxx-lsp"
version     = "0.1.0"
description = "LSP-shaped semantic service over the MC++ semantic API: documents, requests, diagnostics, as JSON"
license     = "Apache-2.0"

[targets.mcxx-lsp]
kind = "lib"

[dependencies]
openkal-llvm-runtime = "0.15.2"   # stated, not inherited: consumers outside this workspace read it
mcxx-base = { path = "../base" }
mcxx-msa  = { path = "../msa" }

[dev-dependencies]
mcxx-testing = { path = "../testing" }

[dependencies.nlohmann]
json = "3.12.0"

[lib]
path = "src/lsp.cppm"
