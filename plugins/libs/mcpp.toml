# Plugins for libraries, one package with a module each (plugins/README.md):
#
#   mcxx.plugins.json   nlohmann::json: json-brace-init (`Json x { expr }` is [expr], not a copy)
[package]
name        = "mcxx-plugins-libs"
version     = "0.1.0"
description = "MC++ plugins for libraries: nlohmann::json (json-brace-init)"
license     = "Apache-2.0"

[targets.mcxx-plugins-libs]
kind = "lib"

[dependencies]
openkal-llvm-runtime = "0.15.2"
mcxx-msa    = { path = "../../modules/msa" }
mcxx-plugin = { path = "../../modules/plugin/sdk" }

[dev-dependencies]
mcxx-testing  = { path = "../../modules/testing" }
mcxx-features = { path = "../../modules/features" }
# Its tests' C library, as the root names it: `mcpp test -p` makes this package the root of a graph the
# root's declaration does not settle (upstream's 0.19.2 cannot start for a constructor on macOS). A
# test-only edge: a package depending on this one is not handed a git declaration to clash with.
openkal-musl = { git = "https://github.com/speak-agent/openkal-musl.git", tag = "0.19.8" }

[lib]
path = "src/libs.cppm"
