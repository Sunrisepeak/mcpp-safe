# MC++'s standard plugins, one package with a module each (plugins/README.md):
#
#   mcxx.plugins.policy  mc++.policy: raw-pointers (policy), lib:std.vector (library)
#   mcxx.plugins.cfg     [[mcpp::cfg(...)]]: target-conditional declarations (a source filter; ext:cfg)
#
# Written against the plugin SDK (mcxx.plugin) only, as any third-party plugin is.
[package]
name        = "mcxx-plugins-std"
version     = "0.1.0"
description = "MC++ standard plugins: mc++.policy and [[mcpp::cfg]]"
license     = "Apache-2.0"

[targets.mcxx-plugins-std]
kind = "lib"

[dependencies]
openkal-llvm-runtime = "0.15.2"
mcxx-msa    = { path = "../../modules/msa" }
mcxx-plugin = { path = "../../modules/plugin/sdk" }

[dev-dependencies]
mcxx-testing  = { path = "../../modules/testing" }
mcxx-features = { path = "../../modules/features" }

[lib]
path = "src/std.cppm"
