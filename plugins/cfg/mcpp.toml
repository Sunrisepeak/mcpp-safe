# [[mcpp::cfg(...)]]: declarations for some targets only, as Rust's #[cfg(...)] (a source-filter
# plugin, MC4 v0). A declaration whose predicate the target does not satisfy is not compiled at all.
[package]
name        = "mcxx-cfg"
version     = "0.1.0"
description = "[[mcpp::cfg(windows)]], [[mcpp::cfg(target_os = \"linux\")]], any/all/not, feature = \"x\": target-conditional declarations"
license     = "Apache-2.0"

[targets.mcxx-cfg]
kind = "lib"

[dependencies]
openkal-llvm-runtime = "0.15.2"
mcxx-msa    = { path = "../../modules/msa" }
mcxx-plugin = { path = "../../modules/plugin" }

[dev-dependencies]
mcxx-testing = { path = "../../modules/testing" }

[lib]
path = "src/cfg.cppm"
