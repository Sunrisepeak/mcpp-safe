# Rules for nlohmann::json (a pitfall-rule plugin, MC4 v0): linked into a program, they run wherever
# MC++'s gates run -- a compile by mcxx, and mcppls through libmc++.
[package]
name        = "mcxx-rules-json"
version     = "0.1.0"
description = "MC++ rules for nlohmann::json: json-brace-init (Json x { expr } is [expr], not a copy)"
license     = "Apache-2.0"

[targets.mcxx-rules-json]
kind = "lib"

[dependencies]
openkal-llvm-runtime = "0.15.2"
mcxx-msa    = { path = "../../modules/msa" }
mcxx-plugin = { path = "../../modules/plugin" }

[dev-dependencies]
mcxx-testing  = { path = "../../modules/testing" }
mcxx-features = { path = "../../modules/features" }

[lib]
path = "src/json.cppm"
