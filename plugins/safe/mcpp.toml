# mc++.safe v0 (M0.7): the restricted features of MC++'s safe dialect and a library-control sample,
# as a plugin (A0.7.4: not in the core). Every feature is allowed by default and denied under
# `profile = "safe"`; a package or module opts in.
[package]
name        = "mcxx-safe"
version     = "0.1.0"
description = "mc++.safe v0: raw pointer arithmetic, new/delete, reinterpret_cast, C arrays, goto, macros, unions, lib:std.vector"
license     = "Apache-2.0"

[targets.mcxx-safe]
kind = "lib"

[dependencies]
openkal-llvm-runtime = "0.15.2"
mcxx-msa    = { path = "../../modules/msa" }
mcxx-plugin = { path = "../../modules/plugin" }

[dev-dependencies]
mcxx-testing  = { path = "../../modules/testing" }
mcxx-features = { path = "../../modules/features" }

[lib]
path = "src/safe.cppm"
